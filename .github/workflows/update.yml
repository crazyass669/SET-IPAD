name: Update SET Data (static)

on:
  schedule:
    - cron: '30 11 * * 1-5'   # 18:30 ICT (11:30 UTC) จันทร์–ศุกร์ หลังตลาดปิด
    - cron: '10 6 * * 1-5'    # 13:10 ICT (06:10 UTC) จันทร์–ศุกร์ หลังตลาดปิดช่วงเช้า
    # เคยลองเพิ่มรอบ ~16:35 (ไม่กี่นาทีหลังตลาดปิดภาคบ่าย) เพื่อลดช่วงที่มือถือ/ไอแพด
    # ค้างราคาปิดภาคเช้าทั้งบ่าย แต่พบว่า Yahoo บางตัว (เช่น AMATA/RS วันที่ 27 ส.ค. 69)
    # ยังไม่ settle ราคาปิดจริงตอนนั้น — bake แล้วได้ราคาผิดแทนที่จะเป็นราคาเก่าแต่ถูก
    # (เดสก์ท็อป sync ห่างออกไป ~30 นาทีได้ราคาที่ถูกต้องแล้ว) จึงตัดออก ยอมรับช่องว่าง
    # เวลานี้ไว้ก่อน ไม่คุ้มความเสี่ยงได้ข้อมูลผิดแบบดูน่าเชื่อถือ
    - cron: '0 23 * * *'      # 06:00 ICT ทุกวัน (23:00 UTC คืนก่อน)
    # ไล่เก็บตกทุกวันจันทร์-ศุกร์ (เดิมมีแค่ศุกร์) — หุ้นสภาพคล่องต่ำบางตัว Yahoo
    # sync ราคาปิดช้ากว่ารอบ 18:30 ICT เป็นประจำ ไม่ใช่แค่ก่อนวันหยุด (run_static_update.py
    # เองก็ retry ในรอบเดียวกันแล้ว ~10-20 นาทีถ้ายังขาด — รอบนี้เป็น safety net ชั้นที่ 2)
    # ตั้งดึกถึง 23:00 ICT เพราะ Insider/ผู้ถือหุ้นใหญ่ (SEC filings) กับ NVDR
    # มักอัปเดตช้ากว่าราคาหุ้นทั่วไปมาก — รอบเดียวนี้แทนที่ทั้ง 20:30 และ Friday 22:00
    - cron: '0 16 * * 1-5'    # 23:00 ICT (16:00 UTC) จันทร์–ศุกร์
  workflow_dispatch:            # กดรันมือได้จาก GitHub UI
    inputs:
      full_refresh:
        description: 'Full Refresh — ดึงราคา 10 ปีใหม่ทั้งหมด (backfill OHLC/Adj Close เข้า cache) ช้า ~30-60 นาที · ไม่ติ๊ก = Quick Update ปกติ'
        type: boolean
        default: false

concurrency:
  group: update-set-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # SQLite price store (~130MB) — cache ระหว่างรันเพื่อให้เป็น quick update
      # (ไม่มี cache = full refresh 10 ปี ~30-60 นาที)
      # indices_cache.json/short_sales_data.json/nvdr_data.json: ไฟล์สถานะสะสมข้าม
      # รอบรัน (ไม่ใช่ไฟล์ที่เว็บ/iPad อ่าน — เว็บอ่าน data/indices_data.json,
      # data/short_sales.json, data/nvdr_data.json ต่างหาก ซึ่ง bake+commit แยกด้านล่าง
      # อยู่แล้ว) 2026-08: ย้ายมาอยู่ที่นี่แทน git commit แล้ว (ยืนยัน cache รอบแรก
      # เก็บสำเร็จจริงก่อนแล้ว — ดู workflow run 30664863568) เดิม commit ตรงๆ ทุกรอบ
      # ~4.9MB/1.6MB/0.6MB x 3-4 รอบ/วัน ทำให้ repo history บวมหลักร้อย MiB โดยไม่มี
      # ใครอ่านเวอร์ชันที่ commit นั้นนอกจาก CI เอง — ห้ามลบ path 3 อันนี้ออกจาก cache
      # โดยไม่เพิ่มอย่างอื่นมาแทน ไม่งั้นรอบถัดไปจะ merge จากไฟล์ว่างเหมือนบั๊ก
      # 2026-07-17 (ตอนนั้น ignore ไว้เฉยๆ ไม่มี cache สำรอง)
      - name: Restore price store cache
        uses: actions/cache@v6
        with:
          path: |
            set_prices.db
            set_data.json
            dr_cache.json
            sec_filings.db
            rotation_state.json
            indices_cache.json
            short_sales_data.json
            nvdr_data.json
          key: set-prices-${{ github.run_id }}
          restore-keys: set-prices-

      # ติ๊ก full_refresh = ลบ price DB ที่ restore มาจาก cache -> run_static_update.py
      # จะไม่เจอ set_prices.db เลย Full Refresh 10 ปีใหม่ทั้งหมด (ดึง OHLC + Adj Close
      # เข้ามาครบ) แล้ว cache รอบนี้จะเก็บ DB ตัวใหม่ไว้ให้รอบถัดๆ ไป quick update ต่อ
      - name: Force Full Refresh (ล้าง price DB ที่ restore มา)
        if: ${{ inputs.full_refresh }}
        run: |
          echo "full_refresh = true -> ลบ set_prices.db เพื่อบังคับ Full Refresh"
          rm -f set_prices.db

      - name: Run unit + golden tests
        run: |
          python tests/test_units.py
          python tests/test_golden.py

      - name: Run static update
        run: python run_static_update.py

      # กันข้อมูลเสีย (เช่น SET.or.th เปลี่ยนรูปแบบหน้าเว็บ แล้วได้หุ้นมาแค่ 50
      # ตัวจาก 927) หลุดขึ้น commit ทับข้อมูลดี — fail ทั้ง workflow ถ้าจำนวน
      # รายการตกลงเกิน threshold (จะได้อีเมลแจ้งเตือนแทนการได้ข้อมูลเพี้ยน)
      - name: Sanity-check data before commit
        run: python ci_sanity_check.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          DATA_PATHS="data/ market_flow_data.json s50_flow_data.json bond_flow_data.json"
          git add $DATA_PATHS
          if git diff --cached --quiet; then
            echo "ไม่มีข้อมูลใหม่ — ข้าม commit"
            exit 0
          fi

          # สำรองไฟล์ข้อมูลที่เพิ่ง bake รอบนี้ไว้นอก git ก่อน กันหายระหว่าง retry —
          # เจอจริง 2026-08-27 หลายรอบติด: มีคน/รอบอื่น push ทับ data/ ชนกันพอดี (ทั้ง
          # จาก auto-commit เครื่องผู้ใช้เอง และ workflow run ที่ทับซ้อนกัน) เดิม rebase
          # ชนแล้ว exit 1 ทันที ทั้งที่ผล bake รอบนี้ถูกต้องสมบูรณ์อยู่แล้ว ต้องมารันใหม่
          # ทั้งรอบเปล่าๆ — path พวกนี้เป็นไฟล์ generate ล้วน ไม่มีใครแก้มือ ปลอดภัยที่จะ
          # เลือกฝั่งเราทับเสมอเวลาชนกัน (ของสดล่าสุดจากรอบนี้ย่อมถูกต้องกว่า)
          BACKUP=$(mktemp -d)
          cp -r data "$BACKUP/data"
          for f in market_flow_data.json s50_flow_data.json bond_flow_data.json; do
            [ -f "$f" ] && cp "$f" "$BACKUP/"
          done

          for i in 1 2 3 4 5; do
            git add $DATA_PATHS
            if git diff --cached --quiet; then
              echo "ข้อมูลตรงกับ remote แล้ว (รอบอื่น push อันเดียวกันไปก่อนแล้ว) — ไม่ต้อง commit ซ้ำ"
              exit 0
            fi
            git commit -q -m "data: auto-update $(date -u '+%Y-%m-%d %H:%M') UTC"
            if git push origin HEAD:main; then
              echo "push สำเร็จ (ครั้งที่ $i)"
              exit 0
            fi
            echo "push ชนกันรอบ $i/5 — sync กับ remote ล่าสุดแล้วคืนไฟล์ของเรากลับ"
            git fetch origin main
            git reset --hard origin/main
            rm -rf data
            cp -r "$BACKUP/data" data
            for f in market_flow_data.json s50_flow_data.json bond_flow_data.json; do
              [ -f "$BACKUP/$f" ] && cp "$BACKUP/$f" .
            done
            sleep $((i * 5))
          done
          echo "push ล้มเหลวครบ 5 รอบ"
          exit 1

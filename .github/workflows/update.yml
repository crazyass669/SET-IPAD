name: Update SET Data (static)

on:
  schedule:
    - cron: '30 11 * * 1-5'   # 18:30 ICT (11:30 UTC) จันทร์–ศุกร์ หลังตลาดปิด
    - cron: '10 6 * * 1-5'    # 13:10 ICT (06:10 UTC) จันทร์–ศุกร์ หลังตลาดปิดช่วงเช้า
    - cron: '0 23 * * *'      # 06:00 ICT ทุกวัน (23:00 UTC คืนก่อน)
  workflow_dispatch:            # กดรันมือได้จาก GitHub UI
    inputs:
      full_refresh:
        description: 'Full Refresh — ดึงราคา 10 ปีใหม่ทั้งหมด (backfill OHLC/Adj Close เข้า cache) ช้า ~30-60 นาที · ไม่ติ๊ก = Quick Update ปกติ'
        type: boolean
        default: false

concurrency:
  group: update-set-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # SQLite price store (~130MB) — cache ระหว่างรันเพื่อให้เป็น quick update
      # (ไม่มี cache = full refresh 10 ปี ~30-60 นาที)
      - name: Restore price store cache
        uses: actions/cache@v6
        with:
          path: |
            set_prices.db
            set_data.json
            dr_cache.json
            sec_filings.db
            rotation_state.json
          key: set-prices-${{ github.run_id }}
          restore-keys: set-prices-

      # ติ๊ก full_refresh = ลบ price DB ที่ restore มาจาก cache -> run_static_update.py
      # จะไม่เจอ set_prices.db เลย Full Refresh 10 ปีใหม่ทั้งหมด (ดึง OHLC + Adj Close
      # เข้ามาครบ) แล้ว cache รอบนี้จะเก็บ DB ตัวใหม่ไว้ให้รอบถัดๆ ไป quick update ต่อ
      - name: Force Full Refresh (ล้าง price DB ที่ restore มา)
        if: ${{ inputs.full_refresh }}
        run: |
          echo "full_refresh = true -> ลบ set_prices.db เพื่อบังคับ Full Refresh"
          rm -f set_prices.db

      - name: Run static update
        run: python run_static_update.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ indices_cache.json short_sales_data.json market_flow_data.json \
                  s50_flow_data.json bond_flow_data.json nvdr_data.json
          if git diff --cached --quiet; then
            echo "ไม่มีข้อมูลใหม่ — ข้าม commit"
            exit 0
          fi
          git commit -m "data: auto-update $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main || true
          git push origin HEAD:main
